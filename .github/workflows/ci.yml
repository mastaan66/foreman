name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check
      - run: node ./foreman.mjs --version | grep -qE '^[0-9]+\.'
      - run: node ./foreman.mjs doctor || true
      - run: node ./foreman.mjs --help | grep -q doctor
